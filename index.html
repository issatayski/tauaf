<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Маршрут Хаджа — Реальная карта</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/MotionPathPlugin.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --gold: #d4af6a;
  --gold-bright: #f4d896;
  --gold-dim: #8a6f3f;
  --bg: #07060a;
  --bg-soft: #14110c;
  --text: #e8dfc9;
  --text-dim: #8a8478;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Manrope', sans-serif;
  font-weight: 300;
  overflow-x: hidden;
  min-height: 100vh;
}

body {
  /* Используем dvh, чтобы корректно работало на мобильных, где есть UI браузера */
  min-height: 100dvh;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(212, 175, 106, 0.06), transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(212, 175, 106, 0.04), transparent 50%),
    radial-gradient(circle at 50% 50%, transparent 0%, var(--bg) 80%);
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3CfeColorMatrix values='0 0 0 0 0.83 0 0 0 0 0.69 0 0 0 0 0.42 0 0 0 0.15 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity: 0.4;
  pointer-events: none;
  z-index: 1;
  mix-blend-mode: overlay;
}

/* ====== ОСНОВНОЙ КОНТЕЙНЕР: всё помещается в viewport ====== */
.page {
  position: relative;
  z-index: 2;
  max-width: 1280px;
  margin: 0 auto;
  padding: clamp(16px, 3vh, 32px) clamp(16px, 3vw, 32px);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: clamp(8px, 1.5vh, 16px);
}

/* Заголовок — компактный */
.header {
  text-align: center;
  flex-shrink: 0;
}

.kicker {
  font-size: clamp(9px, 1vw, 11px);
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: clamp(4px, 0.8vh, 10px);
  font-weight: 500;
}

.title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(22px, 4vw, 42px);
  font-weight: 400;
  letter-spacing: 0.02em;
  background: linear-gradient(180deg, var(--gold-bright), var(--gold));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  line-height: 1.1;
}

/* ====== КАРТА: занимает максимально доступное место ====== */
.map-wrap {
  position: relative;
  perspective: 2000px;
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0; /* критично для flex-shrink */
  width: 100%;
}

.map-stage {
  position: relative;
  /* Размер карты подстраивается под доступное пространство */
  width: min(100%, 70vh, 720px);
  aspect-ratio: 1 / 1;
  transform: rotateX(8deg);
  transform-style: preserve-3d;
  transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.map-wrap:hover .map-stage {
  transform: rotateX(3deg) rotateY(-2deg);
}

.map-svg {
  width: 100%;
  height: 100%;
  display: block;
  filter: drop-shadow(0 20px 60px rgba(212, 175, 106, 0.15));
}

.map-bg { fill: url(#cityTexture); }

.route-line {
  fill: none;
  stroke: rgba(212, 175, 106, 0.15);
  stroke-width: 2;
  stroke-linecap: round;
}

.route-active {
  fill: none;
  stroke: var(--gold-bright);
  stroke-width: 3;
  stroke-linecap: round;
  filter: drop-shadow(0 0 8px var(--gold)) drop-shadow(0 0 16px rgba(212, 175, 106, 0.5));
}

.icon-bg {
  fill: var(--bg);
  stroke: var(--gold);
  stroke-width: 1.5;
  transition: all 0.3s ease;
}

.icon-bg.active {
  fill: var(--gold);
  stroke: var(--gold-bright);
  stroke-width: 2;
  filter: drop-shadow(0 0 14px var(--gold-bright));
}

.icon-symbol {
  fill: var(--gold);
  transition: fill 0.3s ease;
}

.location.is-active .icon-symbol {
  fill: var(--bg);
}

.point-pulse {
  fill: none;
  stroke: var(--gold);
  stroke-width: 1.5;
  opacity: 0;
}

.point-label {
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px;
  font-weight: 500;
  fill: var(--text);
  letter-spacing: 0.04em;
  pointer-events: none;
}

.point-sublabel {
  font-family: 'Manrope', sans-serif;
  font-size: 9px;
  fill: var(--text-dim);
  letter-spacing: 0.25em;
  text-transform: uppercase;
  pointer-events: none;
}

.distance-label {
  font-family: 'Manrope', sans-serif;
  font-size: 11px;
  font-weight: 500;
  fill: var(--gold);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  pointer-events: none;
}

.pilgrim {
  filter: drop-shadow(0 0 8px var(--gold-bright)) drop-shadow(0 0 20px var(--gold));
}

.compass-circle {
  fill: none;
  stroke: var(--gold-dim);
  stroke-width: 0.5;
  opacity: 0.5;
}

.compass-text {
  font-family: 'Manrope', sans-serif;
  font-size: 11px;
  font-weight: 500;
  fill: var(--gold);
  letter-spacing: 0.1em;
}

/* ====== ИНФО-БЛОК И КОНТРОЛЫ — компактные внизу ====== */
.footer {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: clamp(8px, 1.5vh, 14px);
}

.stage-info {
  text-align: center;
  min-height: 0;
}

.stage-day {
  font-size: clamp(9px, 1vw, 11px);
  letter-spacing: 0.4em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 4px;
  font-weight: 500;
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.4s ease;
}

.stage-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(18px, 2.5vw, 24px);
  color: var(--text);
  margin-bottom: 6px;
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.4s ease 0.05s;
  line-height: 1.2;
}

.stage-desc {
  font-size: clamp(12px, 1.4vw, 14px);
  color: var(--text-dim);
  max-width: 640px;
  margin: 0 auto;
  line-height: 1.6;
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.4s ease 0.1s;
}

.stage-info.visible .stage-day,
.stage-info.visible .stage-name,
.stage-info.visible .stage-desc {
  opacity: 1;
  transform: translateY(0);
}

/* Прогресс — пошаговая шкала из точек */
.progress-dots {
  display: flex;
  gap: 8px;
  justify-content: center;
  align-items: center;
}

.progress-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(212, 175, 106, 0.2);
  border: 1px solid var(--gold-dim);
  transition: all 0.4s ease;
  cursor: pointer;
}

.progress-dot.done {
  background: var(--gold);
  border-color: var(--gold-bright);
}

.progress-dot.current {
  background: var(--gold-bright);
  border-color: var(--gold-bright);
  box-shadow: 0 0 12px var(--gold-bright);
  transform: scale(1.4);
}

/* ====== КНОПКИ УПРАВЛЕНИЯ ====== */
.controls {
  display: flex;
  gap: 14px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}

/* Базовая вторичная кнопка (контурная) */
.btn {
  background: rgba(20, 17, 12, 0.6);
  border: 1px solid var(--gold);
  color: var(--gold-bright);
  padding: 10px 22px;
  font-family: 'Manrope', sans-serif;
  font-size: 12px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.25s ease, border-color 0.25s ease,
              color 0.25s ease, box-shadow 0.25s ease, transform 0.15s ease;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}

.btn svg { transition: fill 0.25s ease; }

/* Hover — мягкая золотая подсветка, текст ярче */
.btn:hover:not(:disabled) {
  background: rgba(212, 175, 106, 0.15);
  border-color: var(--gold-bright);
  color: var(--gold-bright);
  box-shadow: 0 0 18px rgba(212, 175, 106, 0.25);
}

/* Focus (после нажатия, навигация с клавиатуры) — кольцо вокруг, текст остаётся ярким */
.btn:focus-visible {
  border-color: var(--gold-bright);
  color: var(--gold-bright);
  box-shadow: 0 0 0 2px rgba(244, 216, 150, 0.35),
              0 0 20px rgba(212, 175, 106, 0.3);
}

/* Active — момент клика: лёгкое вдавливание, текст НЕ исчезает */
.btn:active:not(:disabled) {
  background: rgba(212, 175, 106, 0.25);
  color: var(--bg);
  transform: scale(0.97);
}

.btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  border-color: var(--gold-dim);
  color: var(--gold-dim);
  background: rgba(20, 17, 12, 0.4);
}

/* Первичная (Play) — заливная золотая, тёмный текст */
.btn-primary {
  background: linear-gradient(180deg, var(--gold-bright), var(--gold));
  color: var(--bg);
  border-color: var(--gold-bright);
  min-width: 130px;
  justify-content: center;
  font-weight: 600;
}

.btn-primary svg { fill: var(--bg); }

.btn-primary:hover:not(:disabled) {
  background: linear-gradient(180deg, #ffe5a8, var(--gold-bright));
  color: var(--bg);
  box-shadow: 0 0 26px rgba(244, 216, 150, 0.45);
}

.btn-primary:focus-visible {
  color: var(--bg);
  box-shadow: 0 0 0 2px rgba(244, 216, 150, 0.6),
              0 0 26px rgba(244, 216, 150, 0.45);
}

.btn-primary:active:not(:disabled) {
  background: var(--gold);
  color: var(--bg);
  transform: scale(0.97);
}

.btn-primary:disabled {
  background: rgba(212, 175, 106, 0.3);
  color: rgba(7, 6, 10, 0.5);
  border-color: rgba(212, 175, 106, 0.4);
}

/* Иконочные круглые кнопки */
.btn-icon {
  width: 46px;
  height: 46px;
  padding: 0;
  border-radius: 50%;
  justify-content: center;
}

.btn-icon svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

/* ====== АДАПТИВ ====== */

/* Большие экраны (десктоп) — layout в 2 колонки */
@media (min-width: 1100px) and (min-height: 700px) {
  .page {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    grid-template-rows: auto 1fr;
    gap: 24px 40px;
    align-items: start;
  }
  .header {
    grid-column: 1 / -1;
    margin-bottom: 0;
  }
  .map-wrap {
    grid-column: 1;
    grid-row: 2;
  }
  .footer {
    grid-column: 2;
    grid-row: 2;
    justify-content: center;
  }
  .map-stage {
    width: 100%;
    max-width: 720px;
  }
}

/* Мобильные — вертикально, всё помещается */
@media (max-width: 640px) {
  .map-stage {
    transform: rotateX(4deg);
    width: min(100%, 60vh);
  }
  .point-label { font-size: 14px; }
  .point-sublabel { font-size: 8px; }
  .distance-label { font-size: 9px; }
  .btn {
    padding: 9px 16px;
    font-size: 11px;
    letter-spacing: 0.15em;
  }
  .btn-primary { min-width: 100px; }
  .btn-icon { width: 40px; height: 40px; }
  .controls { gap: 8px; }
}

/* Очень низкие экраны (например, ландшафт на телефоне) */
@media (max-height: 600px) and (orientation: landscape) {
  .page {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr;
    gap: 8px 16px;
    padding: 8px 16px;
  }
  .header { grid-column: 1 / -1; }
  .map-wrap { grid-column: 1; grid-row: 2; }
  .footer { grid-column: 2; grid-row: 2; justify-content: center; }
  .map-stage { width: 100%; max-width: 90vh; }
  .title { font-size: 22px; }
}

@media (prefers-reduced-motion: reduce) {
  .map-stage { transform: none; transition: none; }
  .map-wrap:hover .map-stage { transform: none; }
}
</style>
</head>
<body>

<div class="page">

  <header class="header">
    <div class="kicker">Священный путь</div>
    <h1 class="title">Маршрут Хаджа</h1>
  </header>

  <div class="map-wrap">
    <div class="map-stage">
      <svg class="map-svg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet">

        <defs>
          <radialGradient id="cityTexture" cx="40%" cy="35%" r="80%">
            <stop offset="0%" stop-color="#1a1410" />
            <stop offset="60%" stop-color="#0d0a07" />
            <stop offset="100%" stop-color="#050405" />
          </radialGradient>

          <radialGradient id="pointGlow">
            <stop offset="0%" stop-color="#f4d896" stop-opacity="0.5" />
            <stop offset="100%" stop-color="#f4d896" stop-opacity="0" />
          </radialGradient>

          <symbol id="icon-kaaba" viewBox="-12 -12 24 24">
            <rect x="-8" y="-8" width="16" height="16" fill="currentColor" rx="0.5"/>
            <rect x="-8" y="-5" width="16" height="1.5" fill="var(--gold-bright)" opacity="0.8"/>
            <rect x="5" y="-2" width="1.5" height="5" fill="var(--gold-bright)" opacity="0.7"/>
          </symbol>

          <symbol id="icon-mina" viewBox="-12 -12 24 24">
            <path d="M -9 7 L 0 -8 L 9 7 Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M -3 7 L 0 0 L 3 7 Z" fill="currentColor" opacity="0.5"/>
          </symbol>

          <symbol id="icon-arafat" viewBox="-12 -12 24 24">
            <path d="M -9 7 L -3 -2 L 1 3 L 5 -7 L 9 7 Z" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>
            <circle cx="5" cy="-7" r="0.8" fill="var(--gold-bright)"/>
          </symbol>

          <symbol id="icon-muzdalifa" viewBox="-12 -12 24 24">
            <path d="M -2 -6 A 7 7 0 1 0 -2 6 A 5 5 0 1 1 -2 -6 Z" fill="currentColor"/>
            <path d="M 5 -3 L 5.7 -1.5 L 7.3 -1.3 L 6.1 -0.2 L 6.5 1.4 L 5 0.6 L 3.5 1.4 L 3.9 -0.2 L 2.7 -1.3 L 4.3 -1.5 Z" fill="currentColor"/>
          </symbol>

          <symbol id="icon-jamarat" viewBox="-12 -12 24 24">
            <rect x="-7" y="-7" width="2" height="14" fill="currentColor" rx="0.5"/>
            <rect x="-1" y="-7" width="2" height="14" fill="currentColor" rx="0.5"/>
            <rect x="5" y="-7" width="2" height="14" fill="currentColor" rx="0.5"/>
          </symbol>
        </defs>

        <rect class="map-bg" width="800" height="800" />

        <!-- Декоративные огни -->
        <g opacity="0.45">
          <circle cx="80" cy="120" r="0.8" fill="#d4af6a" opacity="0.8"/>
          <circle cx="150" cy="180" r="0.6" fill="#d4af6a" opacity="0.7"/>
          <circle cx="60" cy="280" r="0.7" fill="#d4af6a" opacity="0.6"/>
          <circle cx="180" cy="320" r="0.5" fill="#d4af6a" opacity="0.5"/>
          <circle cx="220" cy="120" r="0.6" fill="#d4af6a" opacity="0.6"/>
          <circle cx="90" cy="380" r="0.5" fill="#d4af6a" opacity="0.4"/>
          <circle cx="280" cy="280" r="0.5" fill="#d4af6a" opacity="0.4"/>
          <circle cx="340" cy="160" r="0.5" fill="#d4af6a" opacity="0.5"/>
          <circle cx="420" cy="320" r="0.4" fill="#d4af6a" opacity="0.3"/>
          <circle cx="500" cy="450" r="0.3" fill="#d4af6a" opacity="0.25"/>
          <circle cx="600" cy="550" r="0.3" fill="#d4af6a" opacity="0.2"/>
          <circle cx="540" cy="680" r="0.3" fill="#d4af6a" opacity="0.2"/>
          <circle cx="700" cy="680" r="0.4" fill="#d4af6a" opacity="0.3"/>
        </g>

        <!-- Компас -->
        <g transform="translate(720, 80)">
          <circle class="compass-circle" cx="0" cy="0" r="30"/>
          <path d="M 0 -28 L 4 0 L 0 28 L -4 0 Z" fill="var(--gold-dim)" opacity="0.6"/>
          <path d="M 0 -28 L 4 0 L 0 0 Z" fill="var(--gold)" opacity="0.9"/>
          <text class="compass-text" x="0" y="-38" text-anchor="middle">N</text>
          <text class="compass-text" x="0" y="48" text-anchor="middle">S</text>
          <text class="compass-text" x="42" y="4" text-anchor="middle">E</text>
          <text class="compass-text" x="-42" y="4" text-anchor="middle">W</text>
        </g>

        <!-- Фоновая линия маршрута -->
        <path id="bg-route"
              class="route-line"
              d="M 130 200
                 L 364 248
                 L 666 620
                 L 432 411
                 L 287 206
                 L 130 200" />

        <!-- Активные сегменты -->
        <path id="seg-1" class="route-active"
              d="M 130 200 Q 250 215, 364 248"
              stroke-dasharray="500" stroke-dashoffset="500" />
        <path id="seg-2" class="route-active"
              d="M 364 248 Q 500 380, 666 620"
              stroke-dasharray="700" stroke-dashoffset="700" />
        <path id="seg-3" class="route-active"
              d="M 666 620 Q 540 530, 432 411"
              stroke-dasharray="500" stroke-dashoffset="500" />
        <path id="seg-4" class="route-active"
              d="M 432 411 Q 350 320, 287 206"
              stroke-dasharray="450" stroke-dashoffset="450" />
        <path id="seg-5" class="route-active"
              d="M 287 206 Q 200 195, 130 200"
              stroke-dasharray="400" stroke-dashoffset="400" />

        <!-- Лейблы расстояний -->
        <g class="distance-labels">
          <text class="distance-label" x="247" y="222" transform="rotate(11, 247, 222)">7.1 КМ</text>
          <text class="distance-label" x="525" y="430" transform="rotate(55, 525, 430)">11.4 КМ</text>
          <text class="distance-label" x="565" y="500" transform="rotate(-50, 565, 500)">8 КМ</text>
          <text class="distance-label" x="335" y="295" transform="rotate(-55, 335, 295)">5.8 КМ</text>
          <text class="distance-label" x="210" y="190">7 КМ</text>
        </g>

        <!-- Точки -->
        <g class="location" data-id="haram" transform="translate(130, 200)">
          <circle class="point-pulse" r="40" />
          <circle class="point-pulse" r="40" />
          <circle cx="0" cy="0" r="40" fill="url(#pointGlow)" />
          <circle class="icon-bg" r="22" />
          <use href="#icon-kaaba" width="24" height="24" x="-12" y="-12" class="icon-symbol"/>
          <text class="point-label" x="0" y="-32" text-anchor="middle">Аль-Харам</text>
          <text class="point-sublabel" x="0" y="-46" text-anchor="middle">КААБА · СТАРТ</text>
        </g>

        <g class="location" data-id="jamarat" transform="translate(287, 206)">
          <circle class="point-pulse" r="32" />
          <circle cx="0" cy="0" r="32" fill="url(#pointGlow)" />
          <circle class="icon-bg" r="17" />
          <use href="#icon-jamarat" width="18" height="18" x="-9" y="-9" class="icon-symbol"/>
          <text class="point-label" x="0" y="-26" text-anchor="middle" style="font-size: 14px;">Джамарат</text>
          <text class="point-sublabel" x="0" y="-38" text-anchor="middle">ТРИ СТОЛБА</text>
        </g>

        <g class="location" data-id="mina" transform="translate(364, 248)">
          <circle class="point-pulse" r="40" />
          <circle class="point-pulse" r="40" />
          <circle cx="0" cy="0" r="40" fill="url(#pointGlow)" />
          <circle class="icon-bg" r="22" />
          <use href="#icon-mina" width="24" height="24" x="-12" y="-12" class="icon-symbol"/>
          <text class="point-label" x="38" y="-2">Мина</text>
          <text class="point-sublabel" x="38" y="14">ПАЛАТОЧНЫЙ ГОРОД</text>
        </g>

        <g class="location" data-id="muzdalifa" transform="translate(432, 411)">
          <circle class="point-pulse" r="40" />
          <circle class="point-pulse" r="40" />
          <circle cx="0" cy="0" r="40" fill="url(#pointGlow)" />
          <circle class="icon-bg" r="22" />
          <use href="#icon-muzdalifa" width="24" height="24" x="-12" y="-12" class="icon-symbol"/>
          <text class="point-label" x="38" y="-2">Муздалифа</text>
          <text class="point-sublabel" x="38" y="14">ОТКРЫТАЯ РАВНИНА</text>
        </g>

        <g class="location" data-id="arafat" transform="translate(666, 620)">
          <circle class="point-pulse" r="40" />
          <circle class="point-pulse" r="40" />
          <circle cx="0" cy="0" r="40" fill="url(#pointGlow)" />
          <circle class="icon-bg" r="22" />
          <use href="#icon-arafat" width="24" height="24" x="-12" y="-12" class="icon-symbol"/>
          <text class="point-label" x="0" y="46" text-anchor="middle">Арафат</text>
          <text class="point-sublabel" x="0" y="60" text-anchor="middle">ДЖАБАЛЬ АР-РАХМА</text>
        </g>

        <g id="pilgrim" class="pilgrim" opacity="0">
          <circle r="6" fill="var(--gold-bright)" />
          <circle r="12" fill="none" stroke="var(--gold-bright)" stroke-width="0.5" opacity="0.5" />
          <circle r="20" fill="none" stroke="var(--gold)" stroke-width="0.3" opacity="0.3" />
        </g>

        <!-- Масштабная линейка -->
        <g transform="translate(80, 750)">
          <line x1="0" y1="0" x2="100" y2="0" stroke="var(--gold-dim)" stroke-width="1"/>
          <line x1="0" y1="-3" x2="0" y2="3" stroke="var(--gold-dim)" stroke-width="1"/>
          <line x1="50" y1="-2" x2="50" y2="2" stroke="var(--gold-dim)" stroke-width="1"/>
          <line x1="100" y1="-3" x2="100" y2="3" stroke="var(--gold-dim)" stroke-width="1"/>
          <text class="compass-text" x="0" y="18" text-anchor="middle" style="font-size: 9px;">0</text>
          <text class="compass-text" x="50" y="18" text-anchor="middle" style="font-size: 9px;">1.5</text>
          <text class="compass-text" x="100" y="18" text-anchor="middle" style="font-size: 9px;">3 КМ</text>
        </g>

      </svg>
    </div>
  </div>

  <div class="footer">

    <div class="stage-info" id="stageInfo">
      <div class="stage-day" id="stageDay">Готов начать путь</div>
      <div class="stage-name" id="stageName">Священная Мекка</div>
      <div class="stage-desc" id="stageDesc">Карта построена по реальным GPS-координатам. Пять священных мест выстраиваются в линию длиной около 18 км от Каабы на юго-восток к Арафату.</div>
    </div>

    <div class="progress-dots" id="progressDots">
      <div class="progress-dot" data-step="0" title="Начало"></div>
      <div class="progress-dot" data-step="1" title="Мекка → Мина"></div>
      <div class="progress-dot" data-step="2" title="Мина → Арафат"></div>
      <div class="progress-dot" data-step="3" title="Арафат → Муздалифа"></div>
      <div class="progress-dot" data-step="4" title="Муздалифа → Джамарат"></div>
      <div class="progress-dot" data-step="5" title="Возвращение к Каабе"></div>
    </div>

    <div class="controls">
      <button class="btn btn-icon" id="prevBtn" aria-label="Назад" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
        </svg>
      </button>

      <button class="btn btn-primary" id="playBtn">
        <svg id="playIcon" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <span id="playLabel">Play</span>
      </button>

      <button class="btn btn-icon" id="nextBtn" aria-label="Вперёд">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
        </svg>
      </button>

    </div>

  </div>

</div>

<script>
gsap.registerPlugin(MotionPathPlugin);

/* ============================================================
   ДАННЫЕ ЭТАПОВ — длительности увеличены в 2 раза
   ============================================================ */
const stages = [
  {
    seg: '#seg-1',
    point: 'haram',
    nextPoint: 'mina',
    day: 'День 1 · 8 Зуль-хиджа',
    name: 'Мекка → Мина',
    desc: 'Паломник входит в состояние ихрама и направляется из Священной мечети в палаточный город Мина (7,1 км на восток), где проводит первую ночь в молитве.',
    duration: 6  // было 3
  },
  {
    seg: '#seg-2',
    point: 'mina',
    nextPoint: 'arafat',
    day: 'День 2 · 9 Зуль-хиджа',
    name: 'Мина → Арафат',
    desc: 'Главный день Хаджа. Паломник проходит 11,4 км на юго-восток к горе Рахма для вукуфа — стояния перед Всевышним с полудня до заката.',
    duration: 7  // было 3.5
  },
  {
    seg: '#seg-3',
    point: 'arafat',
    nextPoint: 'muzdalifa',
    day: 'Ночь 9 Зуль-хиджа',
    name: 'Арафат → Муздалифа',
    desc: 'После заката паломник возвращается на 8 км на северо-запад в Муздалифу — открытую равнину между Арафатом и Миной. Ночь под звёздами, сбор камней.',
    duration: 6  // было 3
  },
  {
    seg: '#seg-4',
    point: 'muzdalifa',
    nextPoint: 'jamarat',
    day: 'День 3 · 10 Зуль-хиджа',
    name: 'Муздалифа → Джамарат',
    desc: 'Утром паломник идёт 5,8 км на северо-запад к Джамарату — трём столбам в западной части Мины — для символического побивания шайтана камнями.',
    duration: 6  // было 3
  },
  {
    seg: '#seg-5',
    point: 'jamarat',
    nextPoint: 'haram',
    day: 'Финал · Прощальный Тавваф',
    name: 'Возвращение к Каабе',
    desc: 'Завершающий обход Каабы — Тавваф аль-Вида. Паломник возвращается в Мекку (7 км на запад) и прощается со Священным домом.',
    duration: 7  // было 3.5
  }
];

const initialState = {
  day: 'Готов начать путь',
  name: 'Священная Мекка',
  desc: 'Карта построена по реальным GPS-координатам. Пять священных мест выстраиваются в линию длиной около 18 км от Каабы на юго-восток к Арафату.'
};

const startPositions = {
  haram: { x: 130, y: 200 },
  jamarat: { x: 287, y: 206 },
  mina: { x: 364, y: 248 },
  muzdalifa: { x: 432, y: 411 },
  arafat: { x: 666, y: 620 }
};

const segDashvals = [500, 700, 500, 450, 400];

/* ============================================================
   DOM
   ============================================================ */
const playBtn = document.getElementById('playBtn');
const playLabel = document.getElementById('playLabel');
const playIcon = document.getElementById('playIcon');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const stageInfo = document.getElementById('stageInfo');
const stageDay = document.getElementById('stageDay');
const stageName = document.getElementById('stageName');
const stageDesc = document.getElementById('stageDesc');
const pilgrim = document.getElementById('pilgrim');
const progressDots = document.querySelectorAll('.progress-dot');

// SVG-иконки play/pause
const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
const ICON_PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
let currentStep = 0;       // 0 = начальное состояние, 1..5 = после i-го этапа
let masterTl = null;
let isPlaying = false;

/* ============================================================
   ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
   ============================================================ */
function setStageInfo(data) {
  stageInfo.classList.remove('visible');
  setTimeout(() => {
    stageDay.textContent = data.day;
    stageName.textContent = data.name;
    stageDesc.textContent = data.desc;
    stageInfo.classList.add('visible');
  }, 250);
}

function activatePoint(id, active = true) {
  const loc = document.querySelector(`.location[data-id="${id}"]`);
  if (!loc) return;
  const bg = loc.querySelector('.icon-bg');
  if (active) {
    bg.classList.add('active');
    loc.classList.add('is-active');
  } else {
    bg.classList.remove('active');
    loc.classList.remove('is-active');
  }
}

function pulsePoint(id) {
  const pulses = document.querySelectorAll(`.location[data-id="${id}"] .point-pulse`);
  pulses.forEach((p, i) => {
    gsap.fromTo(p,
      { attr: { r: 22 }, opacity: 0.6 },
      {
        attr: { r: 55 },
        opacity: 0,
        duration: 1.5,
        delay: i * 0.5,
        ease: 'power2.out',
        repeat: -1
      }
    );
  });
}

function stopPulse(id) {
  const pulses = document.querySelectorAll(`.location[data-id="${id}"] .point-pulse`);
  pulses.forEach(p => {
    gsap.killTweensOf(p);
    gsap.set(p, { opacity: 0 });
  });
}

function stopAllPulses() {
  ['haram', 'mina', 'arafat', 'muzdalifa', 'jamarat'].forEach(stopPulse);
}

function setPlayIcon(playing) {
  playIcon.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  playLabel.textContent = playing ? 'Пауза' : (currentStep === 0 ? 'Play' : (currentStep === stages.length ? 'Заново' : 'Далее'));
}

function updateProgressDots() {
  progressDots.forEach((dot, i) => {
    dot.classList.remove('done', 'current');
    if (i < currentStep) dot.classList.add('done');
    if (i === currentStep) dot.classList.add('current');
  });
}

function updateNavButtons() {
  prevBtn.disabled = currentStep === 0;
  nextBtn.disabled = currentStep >= stages.length;
}

/* ============================================================
   УСТАНОВКА СОСТОЯНИЯ ПО НОМЕРУ ШАГА
   currentStep = 0 → начальное состояние
   currentStep = N → после прохождения этапа N (1-based)
   ============================================================ */
function setState(step, animated = false) {
  if (masterTl) masterTl.kill();
  isPlaying = false;

  step = Math.max(0, Math.min(stages.length, step));
  currentStep = step;

  // Сброс всех визуальных состояний
  stopAllPulses();
  ['haram', 'mina', 'arafat', 'muzdalifa', 'jamarat'].forEach(id => activatePoint(id, false));

  // Установка состояния сегментов
  stages.forEach((s, i) => {
    if (i < step) {
      gsap.set(s.seg, { strokeDashoffset: 0 });
    } else {
      gsap.set(s.seg, { strokeDashoffset: segDashvals[i] });
    }
  });

  if (step === 0) {
    // Начальное состояние — паломник на Каабе, активна Кааба
    activatePoint('haram');
    pulsePoint('haram');
    gsap.set(pilgrim, { opacity: 1, x: startPositions.haram.x, y: startPositions.haram.y });
    setStageInfo(initialState);
  } else {
    // Состояние после прохождения этапа step
    const stage = stages[step - 1];
    activatePoint(stage.nextPoint);
    pulsePoint(stage.nextPoint);
    const pos = startPositions[stage.nextPoint];
    gsap.set(pilgrim, { opacity: 1, x: pos.x, y: pos.y });
    setStageInfo(stage);
  }

  updateProgressDots();
  updateNavButtons();
  setPlayIcon(false);
}

/* ============================================================
   АНИМИРОВАННЫЙ ПЕРЕХОД НА ОДИН ЭТАП ВПЕРЁД
   ============================================================ */
function animateStep(stepIndex, onComplete) {
  const stage = stages[stepIndex];
  if (!stage) return;

  const startPoint = stepIndex === 0 ? 'haram' : stages[stepIndex - 1].nextPoint;

  stopAllPulses();
  activatePoint(startPoint);

  // Установить паломника в начало
  const startPos = startPositions[startPoint];
  gsap.set(pilgrim, { opacity: 1, x: startPos.x, y: startPos.y });

  // Подготовить сегмент
  gsap.set(stage.seg, { strokeDashoffset: segDashvals[stepIndex] });

  setStageInfo(stage);

  const tl = gsap.timeline({
    onComplete: () => {
      activatePoint(stage.nextPoint);
      pulsePoint(stage.nextPoint);
      if (onComplete) onComplete();
    }
  });

  tl.to(stage.seg, {
    strokeDashoffset: 0,
    duration: stage.duration,
    ease: 'power1.inOut'
  })
  .to(pilgrim, {
    motionPath: {
      path: stage.seg,
      align: stage.seg,
      alignOrigin: [0.5, 0.5],
      autoRotate: false
    },
    duration: stage.duration,
    ease: 'power1.inOut'
  }, '<');

  return tl;
}

/* ============================================================
   PLAY — автопроигрывание оставшихся этапов
   ============================================================ */
function play() {
  // Если в конце — начать сначала
  if (currentStep >= stages.length) {
    setState(0);
  }

  if (isPlaying) {
    // Пауза
    if (masterTl) masterTl.pause();
    isPlaying = false;
    setPlayIcon(false);
    return;
  }

  // Возобновление существующей анимации
  if (masterTl && masterTl.progress() > 0 && masterTl.progress() < 1 && !masterTl.paused()) {
    // уже играет
    return;
  }
  if (masterTl && masterTl.paused() && masterTl.progress() < 1) {
    masterTl.play();
    isPlaying = true;
    setPlayIcon(true);
    return;
  }

  // Новый прогон с текущей точки
  isPlaying = true;
  setPlayIcon(true);

  masterTl = gsap.timeline({
    onComplete: () => {
      isPlaying = false;
      currentStep = stages.length;
      updateProgressDots();
      updateNavButtons();
      playLabel.textContent = 'Заново';
      playIcon.innerHTML = ICON_PLAY;
    }
  });

  for (let i = currentStep; i < stages.length; i++) {
    const stage = stages[i];

    masterTl.call(() => {
      stopAllPulses();
      const startPoint = i === 0 ? 'haram' : stages[i - 1].nextPoint;
      const startPos = startPositions[startPoint];
      activatePoint(startPoint);
      setStageInfo(stage);
    })
    .to(stage.seg, {
      strokeDashoffset: 0,
      duration: stage.duration,
      ease: 'power1.inOut'
    })
    .to(pilgrim, {
      motionPath: {
        path: stage.seg,
        align: stage.seg,
        alignOrigin: [0.5, 0.5],
        autoRotate: false
      },
      duration: stage.duration,
      ease: 'power1.inOut'
    }, '<')
    .call(() => {
      currentStep = i + 1;
      activatePoint(stage.nextPoint);
      pulsePoint(stage.nextPoint);
      updateProgressDots();
      updateNavButtons();
    })
    .to({}, { duration: 1.2 });  // пауза увеличена тоже
  }
}

/* ============================================================
   КНОПКИ НАВИГАЦИИ
   ============================================================ */
function goNext() {
  if (currentStep >= stages.length) return;
  setState(currentStep + 1);
}

function goPrev() {
  if (currentStep === 0) return;
  setState(currentStep - 1);
}

/* ============================================================
   ОБРАБОТЧИКИ
   ============================================================ */
playBtn.addEventListener('click', play);
prevBtn.addEventListener('click', goPrev);
nextBtn.addEventListener('click', goNext);

// Клик по точкам прогресса — переход к нужному этапу
progressDots.forEach((dot, i) => {
  dot.addEventListener('click', () => setState(i));
});

// Клавиатура: стрелки + пробел
document.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowRight') { e.preventDefault(); goNext(); }
  else if (e.code === 'ArrowLeft') { e.preventDefault(); goPrev(); }
  else if (e.code === 'Space') { e.preventDefault(); play(); }
});

// Старт
setState(0);
</script>

</body>
</html>
